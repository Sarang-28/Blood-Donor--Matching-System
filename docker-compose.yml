version: '3.8'

services:
  # 1. PostgreSQL Database with PostGIS
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bloodconnect-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-blood_donor_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - bloodconnect-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodconnect-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-blood_donor_db}
      CLIENT_URL: http://localhost
      JWT_SECRET: ${JWT_SECRET:-bloodconnect_production_secure_jwt_secret_key_2026}
      JWT_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    networks:
      - bloodconnect-net

  # 3. React Frontend with Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloodconnect-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - bloodconnect-net

volumes:
  pgdata:
    driver: local

networks:
  bloodconnect-net:
    driver: bridge
